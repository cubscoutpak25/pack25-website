<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Calendar | Pack 25</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Montserrat:wght@600;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="textured-bg">
    <nav class="navbar patriotic-bg">
        <div class="logo"><i class="fa-solid fa-flag-usa"></i> PACK 25</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dens.html">Adventures</a></li>
            <li><a href="calendar.html" class="active">Calendar</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="https://www.bsaonsc.org/akela" target="_blank" class="district-link"><i class="fa-solid fa-map-location-dot"></i> Akela District</a></li>
        </ul>
    </nav>

    <section class="section container">
        <div class="card title-card patriotic-card text-center mb-2">
            <h2><i class="fa-regular fa-calendar"></i> Pack 25 Calendar</h2>
            <p><strong>Reminder:</strong> Standard meetings are every Tuesday at 6:00 PM at Archdale Friends Meeting Church.</p>
        </div>
        
        <!-- Traditional Interactive Calendar -->
        <div class="interactive-calendar card">
            <div class="calendar-header patriotic-bg">
                <button id="prev-month" class="btn-cal"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="month-year-display">September 2026</h2>
                <button id="next-month" class="btn-cal"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="calendar-days-header">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- Populated via JS -->
            </div>
        </div>

    </section>

    <footer class="footer patriotic-bg mt-4">
        <p>&copy; 2026 Cub Scout Pack 25 | Archdale & Trinity, NC</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
